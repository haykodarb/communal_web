<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Open the connection to Supabase while the app's code downloads: one
		     for supabase-js (CORS, no credentials), one for <img> covers. -->
		<link rel="preconnect" href="%sveltekit.env.PUBLIC_SUPABASE_URL%" crossorigin />
		<link rel="preconnect" href="%sveltekit.env.PUBLIC_SUPABASE_URL%" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f2e9e1" />
		<title>Communal</title>
		<meta
			name="description"
			content="Borrow books from people you know. Communal is a shared library made out of your friends' bookshelves."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Communal" />
		<meta property="og:title" content="Communal" />
		<meta
			property="og:description"
			content="Borrow books from people you know. Communal is a shared library made out of your friends' bookshelves."
		/>
		<meta property="og:url" content="https://communal.ar/" />
		<meta property="og:image" content="https://communal.ar/assets/icon-512.png" />
		<meta name="twitter:card" content="summary" />
		<script>
			// Apply the persisted theme (or the system's, if none was chosen yet)
			// before first paint to avoid a flash. Mirrors #lib/theme.svelte.ts.
			try {
				const SURFACE = { light: '#f2e9e1', dark: '#1a1825' };
				const stored = localStorage.getItem('communal-theme');
				const theme =
					stored === 'light' || stored === 'dark'
						? stored
						: matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', SURFACE[theme]);

				// Mirrors #lib/i18n.svelte.ts's readInitial().
				const storedLocale = localStorage.getItem('communal-locale');
				const locale =
					storedLocale === 'en' || storedLocale === 'es'
						? storedLocale
						: navigator.language?.startsWith('es')
							? 'es'
							: 'en';
				document.documentElement.lang = locale;
			} catch (e) {
				/* ignore */
			}
		</script>
		%sveltekit.head%
		<style>
			/* Shown while the app's JavaScript loads; the root layout removes it. It
			   fades in late so fast loads go straight to the app. */
			#boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				pointer-events: none;
				opacity: 0;
				animation: boot-in 200ms 300ms forwards;
			}
			#boot svg {
				animation: boot-spin 1.2s linear infinite;
			}
			@keyframes boot-in {
				to {
					opacity: 1;
				}
			}
			@keyframes boot-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot svg {
					animation: none;
				}
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- The three arcs of Loading.svelte, at rest. -->
		<div id="boot" aria-hidden="true">
			<svg width="50" height="50" viewBox="0 0 50 50" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round">
				<path d="M5.08 13.5A23 23 0 0 1 41.26 8.74M25 48A23 23 0 0 1 2.78 19.05M44.92 13.5A23 23 0 0 1 30.95 47.22" />
			</svg>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
